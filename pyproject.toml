[project]
name = "markhive"
version = "1.1.5"
description = "Browser bookmark editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyside6>=6.7"]

[project.scripts]
markhive = "markhive:main"

[dependency-groups]
dev = ["nuitka", "ordered-set", "ruff>=0.16.5", "zstandard", "py-spy>=0.4.2"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
